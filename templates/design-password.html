<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>/*[|template_title|]*/0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #1c1c1a;
      background: #f6f5f1;
      font-family: system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 36px;
      border: 1px solid #dcdad3;
      border-radius: 8px;
      background: #fff;
    }
    .brand { color: #4e6f60; font-size: 14px; font-weight: 600; }
    h1 { margin: 24px 0 12px; font: 400 32px/1.2 Georgia, serif; }
    p { color: #5c5b56; font-size: 15px; line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-size: 14px; }
    input, button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d6d4cc;
      border-radius: 4px;
      font: inherit;
      font-size: 16px;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid #4e6f60; outline-offset: 3px; }
    button { margin-top: 14px; border-color: #4e6f60; background: #4e6f60; color: #fff; cursor: pointer; }
    button:hover { background: #3d584b; }
    button:disabled { cursor: wait; opacity: .7; }
    #error { margin-bottom: 0; color: #a12929; min-height: 1.5em; }
    @media (max-width: 420px) { main { padding: 28px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">Strata</div>
    <h1>Product update</h1>
    <p>Enter the password to view this update.</p>
    <form id="password-form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="error" required autofocus>
      <button id="open" type="submit">Open update</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <noscript><p>Enable JavaScript to unlock this page.</p></noscript>
  </main>
  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const staticryptConfig = /*[|staticrypt_config|]*/ 0;
    const staticrypt = staticryptInitiator.init(staticryptConfig, {});
    const form = document.getElementById("password-form");
    const input = document.getElementById("password");
    const button = document.getElementById("open");
    const error = document.getElementById("error");

    if (!window.crypto || !window.crypto.subtle) {
      button.disabled = true;
      error.textContent = "Open this page over HTTPS in a current browser.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = "Opening…";
      error.textContent = "";
      input.removeAttribute("aria-invalid");

      // Fold only the first letter's case; keep the rest of the password exact.
      const password = input.value.charAt(0).toLowerCase() + input.value.slice(1);
      try {
        const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, false);
        if (isSuccessful) return;
        error.textContent = "Incorrect password. Please try again.";
        input.setAttribute("aria-invalid", "true");
      } catch {
        error.textContent = "Unable to open the page. Please try again.";
      }
      button.disabled = false;
      button.textContent = "Open update";
      input.focus();
      input.select();
    });
  </script>
</body>
</html>
